# azure-pipelines.yml
# Pipeline multi-stage para Azure DevOps (Build, Test, Static Analysis, Push Image, Deploy Staging, Deploy Prod)
# Soporta: automatic triggers, manual, tag-based versioned deployments, SonarCloud, Terraform for AWS, Docker -> ECR.

name: Proceso de Integracion Continua

trigger:
  branches:
    include:
      - develop
      - feature/*
      - release/*
      - main

# Permite ejecución manual con variables (Run pipeline -> Run with parameters)
parameters:
  - name: imageTagManual
    displayName: 'Image tag (leave empty to use Build.BuildId)'
    type: string
    default: ''

variables:
  # Defaults - override in pipeline library or at run-time
  awsRegion: 'us-east-1'
  awsAccountId: 340752837689
  serviceName: 'devops-service'
  terraformWorkingDir: 'infra/terraform'
  buildConfiguration: 'Release'
  dotnetSdk: '8.0.x'
  # Service connections and secrets (must create these in Azure DevOps project)
  awsCredentialsEnvVar: 'AWS'                            # We will pass AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY
  sonarCloudServiceConnection: 'SonarOnline'
  sonarOrganization: 'pedrinchi1987'                    # change
  sonarProjectKey: 'pedrinchi1987_RetoNttData'  # 'pmontenegro_devops-service'
  # Variable dependiente de la branch
  ${{ if ne(parameters.imageTagManual, '') }}:
    imageTag: ${{ parameters.imageTagManual }}
  ${{ else }}:
    imageTag: $(Build.BuildId)
  BRANCH_NAME: $(Build.SourceBranch)
  # Variable dependiente de la branch
  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    environmentName: 'prod'
  ${{ elseif startsWith(variables['Build.SourceBranchName'], 'release/') }}:
    environmentName: 'qa'
  ${{ elseif eq(variables['Build.SourceBranchName'], 'develop') }}:
    environmentName: 'dev'
  ${{ elseif startsWith(variables['Build.SourceBranchName'], 'feature/') }}:
    environmentName: 'dev'
  ${{ else }}:
    environmentName: 'dev'
  ecrRepository: '$(serviceName)-$(environmentName)'   # Docker@2 uses this

stages:

#########################
# 1) Build & Restore    #
#########################
- stage: Build
  condition: ${{ eq(parameters.imageTagManual, '') }}
  displayName: 'Build'
  jobs:
    - job: RestoreBuild
      displayName: 'Restore, Build and Pack'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UseDotNet@2
          displayName: 'Use .NET SDK'
          inputs:
            packageType: 'sdk'
            version: $(dotnetSdk)
            
        - script: |
            dotnet --info
            dotnet tool restore || true
            dotnet restore src/DevOpsService/DevOpsService.csproj
          displayName: 'dotnet restore'

        - script: |
            dotnet build src/DevOpsService/DevOpsService.csproj -c $(buildConfiguration) --no-restore
          displayName: 'dotnet build'


#########################
# 2) Test               #
#########################
- stage: Test
  condition: ${{ eq(parameters.imageTagManual, '') }}
  displayName: 'Test'
  dependsOn: Build
  jobs:
    - job: RunTests
      displayName: 'Run unit/integration tests'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: UseDotNet@2
          inputs:
            packageType: 'sdk'
            version: $(dotnetSdk)

        - script: |
            dotnet --info
            dotnet tool restore || true
            dotnet restore tests/DevOpsService.Tests/DevOpsService.Tests.csproj
          displayName: 'dotnet restore'

        - script: |
            dotnet test tests/DevOpsService.Tests/DevOpsService.Tests.csproj --configuration $(buildConfiguration) --logger "trx;LogFileName=test-results.trx" /p:CollectCoverage=true /p:CoverletOutput=$(Build.SourcesDirectory)/coverage.cobertura.xml /p:CoverletOutputFormat=cobertura
          displayName: 'dotnet test'

        - task: PublishTestResults@2
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: '**/*/test-results.trx, **/*.trx'
            failTaskOnFailedTests: true

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish code coverage (if collected)'
          inputs:
            codeCoverageTool: 'Cobertura'
            summaryFileLocation: 'coverage.cobertura.xml'
            pathToSources: 'src'

#########################
# 3) Static analysis    #
#########################
- stage: Analyze
  displayName: 'Static Analysis (SonarCloud)'
  dependsOn: Test
  condition: and(succeeded(), ${{ eq(parameters.imageTagManual, '') }})
  jobs:
    - job: Sonar
      displayName: 'Run SonarCloud analysis'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: SonarCloudPrepare@2
          inputs:
            SonarCloud: $(sonarCloudServiceConnection)
            organization: $(sonarOrganization)
            scannerMode: 'MSBuild'
            projectKey: $(sonarProjectKey)
            projectName: $(sonarProjectKey)
            extraProperties: |
              sonar.sources=src
              sonar.tests=tests
              sonar.branch.name=$(BRANCH_NAME)
              sonar.cs.opencover.reportsPaths=$(Build.SourcesDirectory)/coverage.opencover.xml

        - script: |
            dotnet tool install --global dotnet-sonarscanner
            export PATH="$PATH:/root/.dotnet/tools"
            dotnet build src/DevOpsService/DevOpsService.csproj -c $(buildConfiguration)
            dotnet test tests/DevOpsService.Tests/DevOpsService.Tests.csproj --configuration $(buildConfiguration) --logger "trx;LogFileName=test-results.trx" /p:CollectCoverage=true /p:CoverletOutput=$(Build.SourcesDirectory)/coverage.opencover.xml /p:CoverletOutputFormat=opencover
          displayName: 'Run Sonar scanner'
        
        - task: SonarCloudAnalyze@2
        
        - task: SonarCloudPublish@2
          inputs:
            pollingTimeoutSec: '300'

            
######################################
# 4) Deploy to Staging PreRequisitos #
######################################
- stage: Deploy_Prerequisitos
  displayName: 'Deploy to Prerequisitos'
  condition: ${{ ne(variables.imageTag, '') }}
  jobs:
    - job: DeployToPrerequisitos
      displayName: 'Terraform apply -> Prerequisitos'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # 1. Instalar Terraform (Solución Manual)
        - script: |
            TERRAFORM_VERSION="1.7.0"
            wget https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
            unzip terraform_${TERRAFORM_VERSION}_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform version
          displayName: 'Install Terraform Manually'

        - script: |
            sed -i "s/{AMBIENTE}/$(environmentName)/g" "$(terraformWorkingDir)/requisito/provider.tf"
          displayName: 'Adaptar Nombre Estado Remoto'

        - script: |
            mkdir -p ~/.terraform.d
            echo '{
              "credentials": {
                "app.terraform.io": {
                  "token": "'$(TF_API_TOKEN)'"
                }
              }
            }' > ~/.terraform.d/credentials.tfrc.json
          displayName: 'Credenciales Terraform Cloud'
                    
        - script: |
            cd $(terraformWorkingDir)/requisito
            terraform init
            terraform plan -var="env=$(environmentName)" -var="aws_access_key=$(AWS_ACCESS_KEY_ID)" -var="aws_secret_key=$(AWS_SECRET_ACCESS_KEY)" -var="aws_region=$(awsRegion)" -var="service_name=$(serviceName)" -var="desired_count=2" -var="image_tag=$(imageTag)"
            terraform apply -var="env=$(environmentName)" -var="aws_access_key=$(AWS_ACCESS_KEY_ID)" -var="aws_secret_key=$(AWS_SECRET_ACCESS_KEY)" -var="aws_region=$(awsRegion)" -var="service_name=$(serviceName)" -var="desired_count=2" -var="image_tag=$(imageTag)" -auto-approve
          displayName: 'Terraform init/plan/apply (requisito)'


#########################
# 5) Build & Push Image #
#########################
- stage: PublishImage
  condition: ${{ eq(parameters.imageTagManual, '') }}
  displayName: '🐳 Build & Push Docker Image'
  jobs:
    - job: DockerBuildPush
      displayName: 'Docker Build and Push to ECR'
      pool:
        vmImage: 'ubuntu-latest'

      steps:
        - checkout: self

        - script: |
            echo "🔐 Logging in to Amazon ECR..."
            aws --version
            aws configure set aws_access_key_id $(AWS_ACCESS_KEY_ID)
            aws configure set aws_secret_access_key $(AWS_SECRET_ACCESS_KEY)
            aws configure set region $(awsRegion)
            aws configure set output json
            aws sts get-caller-identity
            aws ecr get-login-password --region $(awsRegion) | docker login --username AWS --password-stdin $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          displayName: '🔑 Login manual to ECR'

        - script: |
            echo "🐳 Building Docker image..."
            docker build -t $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):$(imageTag) -f src/DevOpsService/Dockerfile .
            docker tag $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):$(imageTag) $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):latest

            echo "📤 Pushing image..."
            docker push $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):$(imageTag)
            docker push $(awsAccountId).dkr.ecr.$(awsRegion).amazonaws.com/$(ecrRepository):latest
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
          displayName: '🐳 Build & Push Docker image'

        - task: PublishPipelineArtifact@1
          displayName: '📦 Publish image metadata'
          inputs:
            targetPath: '$(System.DefaultWorkingDirectory)'
            artifact: 'image-info'

######################################
# 6) Deploy to Staging general       #
######################################
- stage: Deploy_General
  condition: ${{ eq(parameters.imageTagManual, '') }}
  displayName: 'Deploy to General'
  jobs:
    - job: DeployToGeneral
      displayName: 'Terraform apply -> General'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # 1. Instalar Terraform (Solución Manual)
        - script: |
            TERRAFORM_VERSION="1.7.0"
            wget https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
            unzip terraform_${TERRAFORM_VERSION}_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform version
          displayName: 'Install Terraform Manually'

        - script: |
            sed -i "s/{AMBIENTE}/$(environmentName)/g" "$(terraformWorkingDir)/general/provider.tf"
          displayName: 'Adaptar Nombre Estado Remoto'

        - script: |
            mkdir -p ~/.terraform.d
            echo '{
              "credentials": {
                "app.terraform.io": {
                  "token": "'$(TF_API_TOKEN)'"
                }
              }
            }' > ~/.terraform.d/credentials.tfrc.json
          displayName: 'Credenciales Terraform Cloud'
          
        - script: |
            cd $(terraformWorkingDir)/general/lambda
            npm init -y
            npm install jsonwebtoken
          displayName: 'Compilar Lambda'
                              
        - script: |
            cd $(terraformWorkingDir)/general
            terraform init
            terraform plan -var="env=$(environmentName)" -var="aws_access_key=$(AWS_ACCESS_KEY_ID)" -var="aws_secret_key=$(AWS_SECRET_ACCESS_KEY)" -var="aws_region=$(awsRegion)" -var="service_name=$(serviceName)" -var="desired_count=2"
            terraform apply  -var="env=$(environmentName)" -var="aws_access_key=$(AWS_ACCESS_KEY_ID)" -var="aws_secret_key=$(AWS_SECRET_ACCESS_KEY)" -var="aws_region=$(awsRegion)" -var="service_name=$(serviceName)" -var="desired_count=2" -auto-approve
          displayName: 'Terraform init/plan/apply (general)'

        - script: |
            echo "General deployed. Outputs:"
            cd $(terraformWorkingDir)
            terraform output -json
          displayName: 'Terraform outputs'
