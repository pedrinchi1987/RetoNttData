# azure-pipelines.yml
# Pipeline multi-stage para Azure DevOps (Build, Test, Static Analysis, Push Image, Deploy Staging, Deploy Prod)
# Soporta: automatic triggers, manual, tag-based versioned deployments, SonarCloud, Terraform for AWS, Docker -> ECR.

trigger:
  branches:
    include:
      - develop
      - feature/*
      - release/*
      - master

pr:
  branches:
    include:
      - develop
      - master

# Permite ejecución manual con variables (Run pipeline -> Run with parameters)
parameters:
  - name: imageTag
    displayName: 'Image tag (leave empty to use Build.BuildId)'
    type: string
    default: ''
  - name: deployTo
    displayName: 'Deploy target (none | staging | production)'
    type: string
    default: 'none'

variables:
  # Defaults - override in pipeline library or at run-time
  awsRegion: 'us-east-1'
  ecrRepository: 'devops-service'
  serviceName: 'devops-service'
  terraformWorkingDir: 'infra/terraform'
  buildConfiguration: 'Release'
  dotnetSdk: '8.0.x'
  # Use Build.BuildId if no imageTag provided
  imageTag: $(Build.BuildId) 
  # Service connections and secrets (must create these in Azure DevOps project)
  awsEcrServiceConnection: 'AWS_ECR_SERVICE_CONNECTION'   # Docker@2 uses this
  awsCredentialsEnvVar: 'Amazon_Pedrinchi'                            # We will pass AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY
  sonarCloudServiceConnection: 'SonarOnline'
  sonarOrganization: 'pmontenegro'                    # change
  sonarProjectKey: 'devops-service'

stages:

#########################
# 5) Deploy to Staging  #
#########################
- stage: Deploy_Staging
  displayName: 'Deploy to Staging'
  jobs:
    - deployment: DeployToStaging
      displayName: 'Terraform apply -> Staging'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
              - script: |
                  echo "Preparing Terraform for staging..."
                  cd $(terraformWorkingDir)
                  terraform init -input=false
                  terraform workspace select staging || terraform workspace new staging
                  terraform plan -var="aws_region=$(awsRegion)" -var="service_name=$(serviceName)" -var="desired_count=2" -out=tfplan-staging
                  terraform apply -auto-approve tfplan-staging
                displayName: 'Terraform init/plan/apply (staging)'
                env:
                  AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
                  AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
                  AWS_DEFAULT_REGION: $(awsRegion)
              - script: |
                  echo "Staging deployed. Outputs:"
                  cd $(terraformWorkingDir)
                  terraform output -json
                displayName: 'Terraform outputs'